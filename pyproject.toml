[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inside-the-game"
version = "0.1.0"
description = "MVP decision aid: full action distributions over pass, shoot, dribble, and hold."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "numpy>=1.26"]
# Microsoft Agent Framework backend for the four-executor decision run.
# agent_workflow.py imports it lazily, so the rest of the suite runs without it.
agent = ["agent-framework-core"]
# Optional System 1 backend. The softmax policy and the test suite do not need it.
jev = ["typesafe-sdk"]
# Video demo. The events tests do not import these.
demo = [
    "numpy>=1.26",
    "opencv-python-headless>=4.8",
    "ultralytics>=8.3",
    "torch>=2.2",
    "lap>=0.5.12",  # ByteTrack matching; no runtime package download in requests.
]

[project.scripts]
inside-the-game = "inside_the_game.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"inside_the_game.system1" = ["weights.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
